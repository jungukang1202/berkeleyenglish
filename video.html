<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="images/버클리원어민영어회화-badge.png">
<title>영상 쉐도잉 | 버클리원어민영어회화</title>
<meta name="description" content="영어 영상을 문장 단위로 듣고 따라 말하는 쉐도잉·에코잉 연습장">
<style>
  :root{
    --bg:#FAF6EC; --panel:#FFFFFF; --border:#EAE1C8; --input-bg:#FBF9F2;
    --text:#1B2A4E; --body-text:#3C4257; --muted:#7C7566;
    --accent:#C9A227; --accent-light:#E8CE73; --accent-soft:#FCF3D6; --accent2:#1B2A4E;
    --good:#1E8E5A; --good-soft:#E4F5EC; --bad:#C4453A; --bad-soft:#FBEAE8; --warn:#B9790A; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Roboto,sans-serif; background:var(--bg); color:var(--body-text); min-height:100vh;}
  button,select,input{font-family:inherit; color:inherit;}
  a{color:var(--accent2);}
  .hidden{display:none !important;}
  header{background:var(--panel); border-bottom:1px solid var(--border); padding:14px 16px;}
  .hwrap{max-width:1240px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .home-link{display:inline-flex; align-items:center; gap:6px; font-size:0.95rem; font-weight:800; color:var(--accent2); text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  header h1{margin:0; font-size:1.2rem; font-weight:800; color:var(--text); letter-spacing:-0.02em; flex:1; min-width:0;}
  .who{font-size:0.85rem; color:var(--muted);}
  .who a{font-weight:700;}
  main{max-width:1240px; margin:0 auto; padding:20px 16px 80px;}

  /* 버튼 */
  .btn{cursor:pointer; border:1px solid var(--border); background:var(--panel); border-radius:10px; padding:9px 14px; font-size:0.9rem; font-weight:700; color:var(--text); transition:transform .08s ease;}
  .btn:active{transform:scale(0.97);}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#1B1503; box-shadow:0 4px 10px rgba(201,162,39,0.35);}
  .btn.primary:hover{background:var(--accent-light);}
  .btn.dark{background:var(--accent2); border-color:var(--accent2); color:#fff; box-shadow:none;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 8px 20px rgba(27,42,78,0.06);}

  /* 목록 */
  .lib-head{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .lib-head h2{margin:0; font-size:1.15rem; color:var(--text);}
  .lib-head p{margin:4px 0 0; color:var(--muted); font-size:0.88rem;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .lesson{padding:18px; border-top:3px solid var(--accent); cursor:pointer; display:flex; flex-direction:column; gap:8px; text-decoration:none; color:inherit; transition:transform .12s ease, box-shadow .12s ease;}
  .lesson:hover{transform:translateY(-2px); box-shadow:0 12px 26px rgba(27,42,78,0.1);}
  .lesson h3{margin:0; font-size:1.02rem; color:var(--text); line-height:1.35;}
  .lesson .desc{font-size:0.84rem; color:var(--muted); line-height:1.5;}
  .lesson .meta{font-size:0.8rem; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; margin-top:auto;}
  .lesson .prog{height:5px; background:var(--border); border-radius:3px; overflow:hidden;}
  .lesson .prog i{display:block; height:100%; background:var(--good);}
  .tag{font-size:0.72rem; font-weight:800; padding:2px 8px; border-radius:999px; background:#EFEAFB; color:var(--accent2);}
  .notice{padding:16px 18px; margin-bottom:16px; background:#FFFBEF; border:1px solid #F0E2B4; border-radius:12px; font-size:0.9rem; color:var(--text);}
  .empty{color:var(--muted); padding:30px; text-align:center;}
  .lv-tabs{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 16px;}
  .lv-tabs .lv-label{font-size:0.85rem; font-weight:800; color:var(--text); margin-right:4px;}
  .lv-tabs button{cursor:pointer; border:1px solid var(--border); background:var(--panel); border-radius:12px; padding:8px 14px; font-size:0.92rem; font-weight:800; color:var(--text); display:inline-flex; flex-direction:column; align-items:center; line-height:1.15; min-width:78px;}
  .lv-tabs button small{font-size:0.7rem; font-weight:600; color:var(--muted);}
  .lv-tabs button.on{background:var(--accent2); border-color:var(--accent2); color:#fff;}
  .lv-tabs button.on small{color:#E8CE73;}
  .tag.lv{background:#1B2A4E; color:#fff;}
  .tag.kids{background:#F2A93B; color:#3A2400;}
  /* 👶 유아: 영상만 보기 */
  .lv-tabs button.kids-tab{border-color:#F2C77A; background:#FFF6E5;}
  .lv-tabs button.kids-tab.on{background:#F2A93B; border-color:#F2A93B; color:#3A2400;}
  .lv-tabs button.kids-tab.on small{color:#5B3B00;}
  .lesson.kids{padding:0; overflow:hidden; border-top-color:#F2A93B;}
  .lesson.kids .thumb{position:relative; aspect-ratio:16/9; background:#2B2B2B center/cover no-repeat; display:flex; align-items:center; justify-content:center;}
  .lesson.kids .thumb b{width:58px; height:58px; border-radius:50%; background:rgba(242,169,59,0.95); color:#3A2400; font-size:1.5rem; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,0.25);}
  .lesson.kids .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px;}
  .watch{max-width:980px; margin:0 auto;}
  .watch .frame{position:relative; aspect-ratio:16/9; background:#000; border-radius:var(--radius); overflow:hidden; box-shadow:0 12px 30px rgba(27,42,78,0.15);}
  .watch .frame iframe, .watch .frame video{position:absolute; inset:0; width:100%; height:100%; border:0; background:#000;}
  .watch .desc{margin:12px 2px 0; color:var(--muted); font-size:0.92rem;}
  .watch h3{margin:22px 2px 10px; font-size:1rem; color:var(--text);}
  .kp-bar{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .kp-bar .nav{width:52px; height:52px; border-radius:50%; border:1px solid #F2C77A; background:#FFF6E5; font-size:1.3rem; cursor:pointer; color:#3A2400;}
  .kp-bar .nav:active{transform:scale(0.94);}
  .kp-modes{display:inline-flex; gap:6px; background:#FFF6E5; border:1px solid #F2C77A; border-radius:16px; padding:5px;}
  .kp-modes button{border:0; background:none; padding:10px 14px; border-radius:12px; cursor:pointer; font-size:0.95rem; font-weight:800; color:#7A5A20;}
  .kp-modes button.on{background:#F2A93B; color:#3A2400; box-shadow:0 3px 10px rgba(242,169,59,0.35);}
  .kp-now{text-align:center; margin-top:8px; font-size:0.85rem; color:var(--muted); min-height:1.2em;}
  .kp-list{display:flex; flex-direction:column; gap:6px;}
  .kp-item{display:flex; align-items:center; gap:12px; padding:8px; border-radius:12px; border:1px solid var(--border); background:var(--panel); cursor:pointer; text-align:left; font:inherit; color:var(--text);}
  .kp-item:hover{border-color:#F2C77A;}
  .kp-item.on{background:#FFF6E5; border-color:#F2A93B;}
  .kp-item .n{width:22px; text-align:center; font-weight:800; color:var(--muted); font-size:0.85rem;}
  .kp-item.on .n{color:#E08A00;}
  .kp-item .th{width:96px; aspect-ratio:16/9; border-radius:8px; background:#2B2B2B center/cover no-repeat; flex:none;}
  .kp-item .t{font-weight:700; font-size:0.93rem; line-height:1.35;}
  @media (max-width:640px){
    .kp-modes{order:-1; flex:1 1 100%; justify-content:center;}
    .kp-modes button{flex:1; padding:10px 6px; font-size:0.86rem;}
    .kp-item .th{width:80px;}
  }

  /* 연습 화면 */
  .layout{display:grid; gap:16px; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);}
  @media (max-width:940px){ .layout{grid-template-columns:1fr;} }
  /* ⏱ 오늘 쉐도잉한 시간: 공부하는 동안 화면 맨 위에 고정 (회원만) */
  .today-bar{position:sticky; top:0; z-index:50; background:#B9F0C9; border-bottom:2px solid #2E7D32; color:#0F3D1A; font-weight:900; font-size:0.98rem; text-align:center; padding:7px 12px; line-height:1.4; box-shadow:0 4px 8px -4px rgba(27,42,78,0.25);}
  .today-bar .parts{font-weight:800; font-size:0.86rem; margin-left:6px;}
  .today-bar .parts b{color:#0D47A1;}
  @media (max-width:640px){ .today-bar{font-size:0.88rem; padding:6px 8px;} .today-bar .parts{display:block; margin:0; font-size:0.78rem;} }
  body.has-today-bar .left, body.has-today-bar .script-card{top:52px;}
  body.has-today-bar .script-card{max-height:calc(100vh - 64px);}
  .left{position:sticky; top:12px; align-self:start; display:flex; flex-direction:column; gap:12px;}
  @media (max-width:940px){ .left{position:static;} }
  .topline{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .topline h2{margin:0; font-size:1.08rem; color:var(--text); flex:1; min-width:200px;}
  select.sel{background:var(--input-bg); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:0.9rem; color:var(--text);}
  .vbox{position:relative; background:#0F1830; border-radius:var(--radius) var(--radius) 0 0; overflow:hidden;}
  .vbox video{width:100%; display:block; max-height:48vh; background:#000;}
  body.audio-only .vbox video{height:0; max-height:0;}
  body.audio-only .vbox{background:linear-gradient(135deg,#1B2A4E,#2D4170); padding:18px; text-align:center; color:#E8CE73; font-weight:800;}
  .audio-note{display:none;}
  body.audio-only .audio-note{display:block;}
  .yt-frame{position:relative; width:100%; aspect-ratio:16/9; max-height:48vh; background:#000; margin:0 auto;}
  .yt-frame iframe{position:absolute; inset:0; width:100%; height:100%;}
  /* YouTube는 플레이어를 숨기면 안 돼서, 소리만 모드에서는 작게 줄여서 보여줍니다 */
  body.audio-only .vbox.yt{padding:12px;}
  body.audio-only .vbox.yt .yt-frame{width:260px; max-width:100%; aspect-ratio:auto; height:200px; border-radius:10px; overflow:hidden;}
  .now{padding:14px 18px 16px;}
  .now .meta{display:flex; justify-content:space-between; color:var(--muted); font-size:0.8rem; margin-bottom:4px;}
  .now .en{font-family:Georgia,"Times New Roman",serif; font-size:1.45rem; line-height:1.4; color:var(--text); min-height:1.4em;}
  .now .ko{color:#1565C0; font-weight:700; margin-top:6px; font-size:0.95rem;} /* 한글 뜻: 눈에 잘 띄는 파란색 */
  .status{display:flex; align-items:center; gap:10px; margin-top:12px; font-size:0.85rem; min-height:28px;}
  .pill{padding:4px 10px; border-radius:999px; background:var(--input-bg); border:1px solid var(--border); font-size:0.8rem; font-weight:700; white-space:nowrap;}
  .pill.go{background:var(--accent-soft); border-color:#EBD58A; color:#7A5C00;}
  .pill.rec{background:var(--bad); border-color:var(--bad); color:#fff;}
  .bar{flex:1; height:6px; border-radius:3px; background:var(--border); overflow:hidden;}
  .bar i{display:block; height:100%; width:0; background:var(--accent);}
  .rep{font-size:0.8rem; color:var(--muted);}
  .score{margin-top:10px; font-size:0.92rem; line-height:2;}
  .score b.badge{display:inline-block; padding:2px 10px; border-radius:999px; margin-right:6px; font-size:0.82rem;}
  .score span{padding:1px 5px; border-radius:5px; margin-right:2px;}
  .w-ok{background:var(--good-soft); color:var(--good);} .w-miss{background:var(--bad-soft); color:var(--bad); text-decoration:line-through;} .w-extra{background:#FCF1DA; color:var(--warn);}
  .score .heard{font-size:0.82rem; color:var(--muted); margin-top:4px;}
  /* 피드백 쉐도잉과 같은 단어 칸: 맞은 단어 초록 · 빠뜨리거나 잘못 발음한 단어 빨강 줄 · 더 말한 단어 주황 */
  .word-compare{margin-top:8px; font-size:0.95rem; line-height:2.1;}
  .word-compare span{padding:2px 6px; border-radius:6px; margin-right:2px; display:inline-block;}
  .b-good{background:var(--good-soft); color:var(--good);} .b-mid{background:#FCF1DA; color:var(--warn);} .b-bad{background:var(--bad-soft); color:var(--bad);}

  .controls{padding:14px 16px; display:grid; gap:12px;}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .row label.k{color:var(--muted); font-size:0.8rem; font-weight:700; min-width:64px;}
  .seg{display:inline-flex; background:var(--input-bg); border:1px solid var(--border); border-radius:10px; padding:3px;}
  .seg button{border:0; background:none; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:0.86rem; font-weight:700; color:var(--muted);}
  .seg button.on{background:var(--accent2); color:#fff;}
  .chk{display:inline-flex; gap:6px; align-items:center; font-size:0.85rem; cursor:pointer;}
  .hint{color:var(--muted); font-size:0.78rem; line-height:1.6;}
  .hint kbd{background:var(--input-bg); border:1px solid var(--border); border-radius:4px; padding:0 5px; font:11px ui-monospace,monospace;}
  .big{display:flex; gap:8px;}
  .big .primary{flex:1;}

  .script-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border);}
  .script-head b{color:var(--text);}
  .script-head span{font-size:0.82rem; color:var(--muted);}
  .list{overflow:auto; padding:6px;}
  /* 스크립트 칸: 왼쪽(영상·설정) 높이에 맞춰 늘어나지 않고 화면 높이에 딱 맞게 — 목록은 칸 안에서 스크롤 */
  .layout{align-items:start;}
  .script-card{position:sticky; top:12px; display:flex; flex-direction:column; max-height:calc(100vh - 24px);}
  .script-card .list{flex:1 1 auto; min-height:0;}
  @media (max-width:940px){ .script-card{position:static; max-height:none;} .script-card .list{max-height:none;} }
  .s{display:grid; grid-template-columns:50px 1fr auto; gap:4px 10px; padding:10px; border-radius:10px; cursor:pointer; border:1px solid transparent;}
  .s:hover{background:var(--input-bg);}
  .s.cur{background:var(--accent-soft); border-color:var(--accent);}
  .s .t{color:var(--muted); font:12px ui-monospace,monospace; padding-top:3px;}
  /* 공부한 문장 ✓ · 책갈피 🔖 */
  .s.done{background:rgba(46,158,107,0.07); border-left:3px solid var(--good);}
  .s.done .t::before{content:"✓ 공부함"; display:block; color:var(--good); font:800 10.5px/1.2 system-ui,sans-serif; margin-bottom:2px;}
  .s.done.cur{background:var(--accent-soft);}
  .s.bm{box-shadow:inset 0 0 0 2px #E8A33A;}
  .s.bm .t::after{content:"🔖 책갈피"; display:block; color:#C27C0E; font:800 10.5px/1.2 system-ui,sans-serif; margin-top:3px;}
  .s.flash{animation:bmflash 1.4s ease 2;}
  @keyframes bmflash{0%,100%{background:inherit;} 50%{background:#FFE7B8;}}
  .bm-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 12px; padding:10px 14px; border-radius:12px; background:#FFF6E5; border:1px solid #F2C77A; color:#5B3B00; font-size:0.9rem;}
  .bm-bar .txt{flex:1; min-width:200px; line-height:1.45;}
  .bm-bar .txt i{font-style:normal; color:#3A2400; font-weight:700;}
  .bm-bar .go{border:0; background:#F2A93B; color:#3A2400; font-weight:800; padding:8px 14px; border-radius:10px; cursor:pointer; font-size:0.9rem; white-space:nowrap;}
  .script-head .mini{border:0; background:none; color:var(--muted); font-size:0.75rem; cursor:pointer; text-decoration:underline; margin-left:8px; padding:0;}
  .lesson .meta .bm{color:#C27C0E; font-weight:800;}
  .s .e{font-size:0.98rem; color:var(--text); line-height:1.45;}
  .s .k{color:#1565C0; font-weight:700; font-size:0.86rem; margin-top:2px;} /* 스크립트의 한글 뜻: 눈에 잘 띄는 파란색 */
  .s .sc, .bm-bar .sc{font-size:0.72rem; font-weight:800; padding:1px 7px; border-radius:999px; margin-left:4px; vertical-align:1px;}
  /* 문장마다 마지막으로 따라 말한 결과: 잘못 발음한(빠뜨린) 단어 · 더 말한 단어 · 내가 말한 문장 */
  .s .rv, .bm-bar .rv{margin-top:6px; font-size:0.8rem; line-height:1.9; color:#111; font-weight:700;}
  .s .rv .rw, .bm-bar .rv .rw{display:inline-block; padding:0 6px; border-radius:6px; margin:0 2px 2px 0; background:#FBEAE8; color:var(--bad); text-decoration:line-through; font-weight:700;}
  .s .rv .rx, .bm-bar .rv .rx{display:inline-block; padding:0 6px; border-radius:6px; margin:0 2px 2px 0; background:#FCF1DA; color:var(--warn); font-weight:700;}
  .s .rv .rh, .bm-bar .rv .rh{color:var(--muted); font-weight:600; line-height:1.4;}
  .s .rv.ok, .bm-bar .rv.ok{color:var(--good);}
  .acts{display:flex; gap:2px;}
  .acts button{border:0; background:none; cursor:pointer; padding:4px 6px; border-radius:6px; font-size:0.9rem; color:var(--muted);}
  .acts button:hover{background:var(--panel); color:var(--text);}
  .acts button.has{color:var(--accent);}
  .acts button.recing{color:var(--bad); animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.35}}
  .w{border-radius:3px;}
  .w:hover{background:var(--accent-soft); color:#7A5C00;}
  .part-sep{padding:8px 10px 4px; font-size:0.75rem; font-weight:800; color:var(--accent2);}
  body.t-blur .s .e, body.t-blur .s .rv, body.t-blur .bm-bar .rv, body.t-blur .now .en{filter:blur(6px); transition:filter .15s;}
  body.t-hide .s .rv, body.t-hide .bm-bar .rv{visibility:hidden;} /* 자막 숨기기 때는 발음 결과도 숨겨요 */
  body.t-blur .s:hover .e, body.t-blur .now .en:hover{filter:none;}
  body.t-hide .s .e, body.t-hide .now .en{color:transparent; background:repeating-linear-gradient(90deg,var(--border) 0 10px,transparent 10px 14px); border-radius:4px;}
  body.t-hide.reveal .s.cur .e, body.t-hide.reveal .now .en{color:inherit; background:none;}
  body.no-ko .k, body.no-ko .now .ko{display:none;}
  .pop{position:fixed; z-index:20; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 30px rgba(27,42,78,.2); padding:8px; display:none; min-width:190px;}
  .pop b{display:block; padding:2px 8px 6px; font-family:Georgia,serif; font-size:1.05rem; color:var(--text);}
  .pop a{display:block; padding:7px 8px; border-radius:6px; text-decoration:none; font-size:0.88rem;}
  .pop a:hover{background:var(--input-bg);}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--accent2); color:#fff; padding:10px 16px; border-radius:10px; font-size:0.88rem; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; z-index:30;}
  .toast.on{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <a class='home-link' href='/'>🏠 홈</a>
    <h1>🎬 영상 쉐도잉</h1>
    <div class="who" id="who"></div>
  </div>
</header>
<div class="today-bar hidden" id="todayBar"></div>

<main>
  <!-- ===== 영상 목록 ===== -->
  <section id="libView">
    <div class="lib-head">
      <div>
        <h2>연습할 영상을 고르세요</h2>
        <p id="libSub">문장 단위로 듣고 → 같이 따라 말한 뒤(쉐도잉) → 멈춘 시간에 혼자 한 번 더 말해요(에코잉).</p>
      </div>
    </div>
    <div class="lv-tabs" id="lvTabs">
      <span class="lv-label">내 레벨</span>
      <button data-lv="kids" class="kids-tab">👶 유아<small>영상 보기</small></button>

<script>
(function () {
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => { t = Math.max(0, t || 0); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = Math.floor(t % 60); return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2800); }
const LS = {
  get(k, d) { try { const x = localStorage.getItem(k); return x == null ? d : JSON.parse(x); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  raw(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const params = new URLSearchParams(location.search);
const ADMIN = params.get('admin') === '1' && LS.raw('shadowing_admin_token');
const MEMBER_TOKEN = LS.raw('shadowing_member_token');
const MEMBER_NAME = LS.raw('shadowing_member_username');
// '← 목록'은 학생 화면(💬 피드백 · 📖 교재 · 🎬 영상 쉐도잉 글상자가 있는 곳)의 영상 쉐도잉으로 돌아가요. (관리자 미리보기는 그대로 영상 목록)
if (!ADMIN) $('#backBtn').href = 'member.html?view=video';

/* ---- 연습 기록: 회원 쉐도잉과 같은 기록 저장소(practice-log)에 'video-영상ID'로 쌓여 관리자 📊 연습 기록·월간 리포트에 들어가요 ---- */
let pq = [], pTimer = null, pSession = '', repLogged = false;
function practiceOn() { return !ADMIN && !!LS.raw('shadowing_member_token') && !!(window.__lessonId); }
function logAttempt(s, rec) {
  if (!practiceOn() || !s) return;
  pq.push(Object.assign({ at: new Date().toISOString(), type: 'sentence', idx: s.i, target: s.en, session: pSession || 'v' }, rec));
  if (pq.length >= 20) flushPractice(); else { clearTimeout(pTimer); pTimer = setTimeout(flushPractice, 5000); }
}
async function flushPractice(keepalive) {
  clearTimeout(pTimer);
  if (!pq.length || !practiceOn()) return;
  const batch = pq.splice(0, 200);
  try {
    const r = await fetch('/api/member-practice', {
      method: 'POST', keepalive: !!keepalive,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + LS.raw('shadowing_member_token') },
      body: JSON.stringify({ setId: 'video-' + window.__lessonId, attempts: batch }),
    });
    if (!r.ok && r.status >= 500 && !keepalive) { pq = batch.concat(pq); pTimer = setTimeout(flushPractice, 15000); }
  } catch (e) { if (!keepalive) { pq = batch.concat(pq); pTimer = setTimeout(flushPractice, 15000); } }
}
window.addEventListener('pagehide', () => flushPractice(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushPractice(true); });
function micRecord(res, r, of) {
  if (!res || res.error === 'aborted') return null;
  return res.ok ? { mode: 'mic', ok: true, heard: res.heard, score: res.score, rep: r, of }
                : { mode: 'mic', ok: false, error: String(res.error || res.code || 'fail'), rep: r, of };
}

async function api(url, token) {
  const headers = token ? { Authorization: 'Bearer ' + token } : {};
  let r = await fetch(url, { headers });
  if (r.status === 401 && token && !ADMIN) { LS.del('shadowing_member_token'); r = await fetch(url); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || ('HTTP ' + r.status)), { status: r.status });
  return d;
}

/* ===================== 목록 ===================== */
async function showLibrary() {
  $('#libView').classList.remove('hidden'); $('#playView').classList.add('hidden');
  try {
    const d = await api('/api/member-videos', MEMBER_TOKEN);
    $('#who').innerHTML = d.loggedIn ? `<b>${esc(d.username)}</b>님 · <a href="member.html">내 쉐도잉</a>` : `<a href="member.html?next=video.html">회원 로그인</a>`;
    $('#guestNotice').classList.toggle('hidden', !!d.loggedIn);
    const ALL = d.lessons || [];
    let myLv = LS.get('vs:level', null);
    if (!myLv) myLv = 'all';
    document.querySelectorAll('#lvTabs [data-lv]').forEach(b => {
      b.classList.toggle('on', b.dataset.lv === myLv);
      b.onclick = () => { LS.set('vs:level', b.dataset.lv); showLibrary(); };
    });
    $('#libSub').textContent = myLv === 'kids' ? '👶 보고 싶은 영상을 누르면 크게 틀어 볼 수 있어요.' : '문장 단위로 듣고 → 같이 따라 말한 뒤(쉐도잉) → 멈춘 시간에 혼자 한 번 더 말해요(에코잉).';
    // 내 레벨을 고르면 그 레벨 영상만 (레벨이 안 정해진 영상은 '전체 보기'에서만)
    // '전체 보기'는 레벨 순서(👶 유아 → Lv 1-2 → 3-4 → 5-6 → 7-9 → 레벨 없음)로, 같은 레벨 안에서는 원래 순서 그대로
    const LV_ORDER = ['kids', '1-2', '3-4', '5-6', '7-9'];
    const lvRank = v => { const i = LV_ORDER.indexOf(v.level || ''); return i < 0 ? LV_ORDER.length : i; };
    const L = myLv === 'all' ? ALL.slice().sort((a, b) => lvRank(a) - lvRank(b)) : ALL.filter(v => v.level === myLv);
    if (!L.length && ALL.length) { $('#lib').innerHTML = `<div class="empty">${myLv === 'kids' ? '유아' : 'Lv ' + esc(myLv)} 영상이 아직 없어요. 다른 레벨이나 '전체 보기'를 눌러 보세요.</div>`; return; }
    if (!L.length) { $('#lib').innerHTML = `<div class="empty">${d.loggedIn ? '아직 올라온 영상이 없어요.' : '공개된 영상이 없어요. 회원 로그인을 해주세요.'}</div>`; return; }
    $('#lib').innerHTML = L.map(v => {
      if (v.watchOnly) return kidsCard(v);
      const sp = (d.progress || {})[v.id];
      const done = Math.max((LS.get('vs:' + v.id + ':done', []) || []).length, sp ? sp.done : 0);
      const hasBm = !!LS.get('vs:' + v.id + ':last', null) || !!(sp && sp.last != null);
      const pct = v.sentenceCount ? Math.round(done / v.sentenceCount * 100) : 0;
      return `<a class="card lesson" href="video.html?id=${encodeURIComponent(v.id)}">
        <h3>${esc(v.title)}</h3>
        ${v.description ? `<div class="desc">${esc(v.description)}</div>` : ''}
        <div class="prog"><i style="width:${pct}%"></i></div>
        <div class="meta"><span>⏱ ${fmt((v.clipEnd || v.duration) - (v.clipStart || 0))}</span>${v.youtubeId ? '<span>▶ YouTube</span>' : ''}${v.level ? `<span class="tag lv">Lv ${esc(v.level)}</span>` : ''}<span>💬 ${v.sentenceCount}문장</span><span>${pct ? '✓ ' + Math.min(100, pct) + '% 공부함' : '새 영상'}</span>${hasBm ? '<span class="bm">🔖 이어서 하기</span>' : ''}${v.visibility === 'public' ? '' : '<span class="tag">회원</span>'}</div>
      </a>`;
    }).join('');
  } catch (e) { $('#lib').innerHTML = `<div class="empty">⚠️ 목록을 불러오지 못했어요 (${esc(e.message)})</div>`; }
}

// 👶 유아 영상 카드: 썸네일을 크게, 누르면 바로 영상 보기
function kidsCard(v) {
  const th = v.youtubeId ? `style="background-image:url('https://i.ytimg.com/vi/${encodeURIComponent(v.youtubeId)}/hqdefault.jpg')"` : '';
  return `<a class="card lesson kids" href="video.html?id=${encodeURIComponent(v.id)}">
    <div class="thumb" ${th}><b>▶</b></div>
    <div class="body">
      <h3>${esc(v.title)}</h3>
      ${v.description ? `<div class="desc">${esc(v.description)}</div>` : ''}
      <div class="meta"><span class="tag kids">👶 유아</span><span>📺 영상 보기</span>${v.visibility === 'public' ? '' : '<span class="tag">회원</span>'}</div>
    </div>
  </a>`;
}

// 👶 유아 영상: 쉐도잉 없이 영상만 크게 + 재생 목록 (🔂 한 곡 반복 · 🔁 전체 재생 · 🔀 셔플 재생)
// 다음 곡은 페이지를 다시 열지 않고 같은 플레이어에서 바꿔 틀어요(휴대폰에서도 자동으로 이어서 재생되도록).
const KP = { list: [], idx: 0, mode: 'all', media: null, kind: '', clipEnd: 0, token: 0, guardUntil: 0, queue: [], history: [] };
const KP_MODE_TEXT = { one: '🔂 이 노래를 계속 반복해요', all: '🔁 목록 순서대로 전부 재생해요 (끝나면 처음부터)', shuffle: '🔀 목록을 섞어서 전부 재생해요' };
const ytThumb = v => (v.youtubeId ? `https://i.ytimg.com/vi/${encodeURIComponent(v.youtubeId)}/mqdefault.jpg` : '');

async function showWatch(D, streamUrl) {
  $('#practiceLayout').classList.add('hidden'); $('#part').classList.add('hidden');
  $('#watchView').classList.remove('hidden');
  KP.mode = ['one', 'all', 'shuffle'].includes(LS.get('kids:mode', 'all')) ? LS.get('kids:mode', 'all') : 'all';
  KP.list = [D]; KP.idx = 0;
  D._streamUrl = streamUrl;
  setKpMode(KP.mode, true);
  $('#kpModes').onclick = e => { const b = e.target.closest('[data-m]'); if (b) setKpMode(b.dataset.m); };
  $('#kpNext').onclick = () => kpGo(kpNextIdx(), true);
  $('#kpPrev').onclick = () => kpGo(kpPrevIdx(), true);
  $('#kpList').onclick = e => { const b = e.target.closest('[data-i]'); if (b) kpGo(Number(b.dataset.i), true); };
  if (!ADMIN) {
    try {
      const d = await api('/api/member-videos', MEMBER_TOKEN);
      const kids = (d.lessons || []).filter(v => v.watchOnly);
      const at = kids.findIndex(v => v.id === D.id);
      if (at >= 0) { kids[at] = Object.assign({}, kids[at], D); KP.list = kids; KP.idx = at; }
      else { KP.list = [D, ...kids]; KP.idx = 0; }
    } catch (e) {}
  }
  renderKpList();
  setInterval(() => { // 끝 시간이 정해진 영상: 그 시간이 되면 '끝난 것'으로
    const m = KP.media; if (!m || !KP.clipEnd || m.paused || performance.now() < KP.guardUntil) return;
    const t = m.isYouTube ? (m.player.getCurrentTime ? m.player.getCurrentTime() : 0) : m.currentTime;
    if (t >= KP.clipEnd) kpEnded(KP.token); // 바로 다음 곡(또는 같은 곡)을 불러오니 따로 멈추지 않아요
  }, 250);
  await kpPlay(KP.idx, false);
}

function setKpMode(m, quiet) {
  KP.mode = m; LS.set('kids:mode', m); KP.queue = [];
  document.querySelectorAll('#kpModes [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  if (!quiet) toast(KP_MODE_TEXT[m]);
  updateKpNow();
}
function updateKpNow() {
  const n = KP.list.length;
  $('#kpNow').textContent = n > 1 ? `${KP_MODE_TEXT[KP.mode]} · ${KP.idx + 1} / ${n}곡` : KP_MODE_TEXT[KP.mode];
}
function renderKpList() {
  const n = KP.list.length;
  $('#kpHead').classList.toggle('hidden', n < 2);
  $('#kpHead').textContent = `🎵 재생 목록 (${n}곡)`;
  $('#kpList').innerHTML = n < 2 ? '' : KP.list.map((v, i) => `
    <button class="kp-item${i === KP.idx ? ' on' : ''}" data-i="${i}">
      <span class="n">${i === KP.idx ? '▶' : i + 1}</span>
      <span class="th" ${v.youtubeId ? `style="background-image:url('${ytThumb(v)}')"` : ''}></span>
      <span class="t">${esc(v.title)}</span>
    </button>`).join('');
}
// 셔플: 아직 안 튼 곡을 무작위로, 다 틀면 다시 섞기
function kpNextIdx() {
  const n = KP.list.length; if (n < 2) return KP.idx;
  if (KP.mode === 'shuffle') {
    if (!KP.queue.length) {
      KP.queue = KP.list.map((_, i) => i).filter(i => i !== KP.idx);
      for (let i = KP.queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [KP.queue[i], KP.queue[j]] = [KP.queue[j], KP.queue[i]]; }
    }
    return KP.queue.shift();
  }
  return (KP.idx + 1) % n;
}
function kpPrevIdx() {
  const n = KP.list.length; if (n < 2) return KP.idx;
  if (KP.history.length) return KP.history.pop();
  return (KP.idx - 1 + n) % n;
}
function kpGo(i, user) {
  if (i !== KP.idx) { KP.history.push(KP.idx); if (KP.history.length > 50) KP.history.shift(); }
  if (user && KP.mode === 'shuffle') KP.queue = KP.queue.filter(x => x !== i);
  kpPlay(i, true);
}
function kpEnded(token) {
  if (token !== KP.token || performance.now() < KP.guardUntil) return; // 같은 곡에서 두 번 처리하지 않게
  KP.token++;
  if (KP.mode === 'one') kpPlay(KP.idx, true);
  else kpGo(kpNextIdx(), false);
}

async function kpPlay(i, autoplay) {
  const item = KP.list[i]; if (!item) return;
  KP.idx = i; const token = ++KP.token; KP.guardUntil = performance.now() + 1500;
  KP.clipEnd = item.clipEnd || 0;
  $('#lessonTitle').textContent = item.title;
  document.title = item.title + ' | 유아 영상';
  $('#watchDesc').textContent = item.description || '';
  if (!ADMIN) try { history.replaceState(null, '', 'video.html?id=' + encodeURIComponent(item.id)); } catch (e) {}
  renderKpList(); updateKpNow();
  const box = $('#watchFrame');
  const start = item.clipStart || 0;
  try {
    if (item.youtubeId) {
      if (KP.kind === 'yt' && KP.media && KP.media.player && KP.media.player.loadVideoById) {
        const args = { videoId: item.youtubeId, startSeconds: start };
        if (autoplay) KP.media.player.loadVideoById(args); else KP.media.player.cueVideoById(args);
      } else {
        if (KP.media && KP.media.destroy) KP.media.destroy();
        KP.media = null; KP.kind = 'yt';
        const m = await YTMedia.create(box, item.youtubeId, { start });
        if (token !== KP.token) { m.destroy(); return; }
        m.addEventListener('ended', () => kpEnded(KP.token));
        KP.media = m;
        if (autoplay) m.play().catch(() => {});
      }
    } else {
      let url = item._streamUrl;
      if (!url) { const d = await api('/api/member-videos?id=' + encodeURIComponent(item.id), MEMBER_TOKEN); url = item._streamUrl = d.streamUrl; }
      if (token !== KP.token) return;
      if (KP.kind !== 'file' || !KP.media) {
        if (KP.media && KP.media.destroy) KP.media.destroy();
        box.innerHTML = '<video controls playsinline preload="metadata"></video>';
        const vEl = box.firstChild;
        vEl.addEventListener('ended', () => kpEnded(KP.token));
        KP.media = vEl; KP.kind = 'file';
      }
      if (KP.media.getAttribute('src') !== url) KP.media.src = url;
      KP.media.currentTime = start;
      if (autoplay) KP.media.play().catch(() => {});
    }
  } catch (e) {
    box.innerHTML = `<div class="empty" style="color:#fff; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">⚠️ ${esc(e.message)}</div>`;
    KP.media = null; KP.kind = '';
    // 재생할 수 없는 영상은 건너뛰기 (반복 모드가 아니고 목록이 있을 때)
    if (autoplay && KP.mode !== 'one' && KP.list.length > 1) setTimeout(() => { if (token === KP.token) kpEnded(KP.token); }, 2500);
  }
}

/* ===================== 연습 ===================== */
let v = $('#v');
let D = null, KEY = '';
let S = {};
let done = new Set();
let parts = [], list = [], cur = 0, rep = 0, running = false;
let stopAt = null, onReach = null, timers = [], countdown = null;
// 문장 재생 감시: 영상이 문장 시작으로 '실제로' 옮겨진 것을 확인한 뒤에만 끝 지점을 봅니다.
let segFrom = 0, segArmed = false, segAt = 0, segRetry = 0;
const recs = {}, scores = {};
let review = {}; // 문장(i)별 마지막 따라 말하기 결과 { score, miss:[잘못 발음·빠뜨린 단어], extra:[더 말한 단어], heard, at } — 이 기기에 저장

async function showPlayer(id) {

    if (e.status === 401) location.href = 'member.html?next=' + encodeURIComponent('video.html?id=' + id);

  }
  D = d.lesson; KEY = 'vs:' + D.id + ':'; window.__lessonId = D.id;
  if (D.watchOnly) { $('#lessonTitle').textContent = D.title; return showWatch(D, d.streamUrl); }
  document.title = D.title + ' | 영상 쉐도잉';
  $('#lessonTitle').textContent = D.title;
  // 체크 상자(번역 · 신호음 · 녹음·재생 · 일치도 채점)는 모두 켠 상태가 기본
  // 예전에 저장된 설정도 한 번은 모두 켜 주고, 그 뒤로는 학생이 바꾼 대로 기억해요
  if (LS.get('vs:defaultsV', 0) < 2) {
    const old = LS.get('vs:settings', null);
    if (old) LS.set('vs:settings', Object.assign(old, { ko: true, cue: true, rec: true, grade: true }));
    LS.set('vs:defaultsV', 2);
  }
  S = Object.assign({ mode: 'shadow', reps: 2, rate: 1, wait: 1.5, text: 'show', ko: true, rec: true, grade: true, cue: true, view: D.mime && D.mime.startsWith('audio') ? 'audio' : 'video', part: 0 }, LS.get('vs:settings', {}), LS.get(KEY + 'pos', {}));
  if (S.mode !== 'listen') S.mode = 'shadow'; // 예전 '에코잉' 모드는 이제 쉐도잉 안에 들어 있어요
  S.rec = false; S.grade = true; // 내 목소리 녹음은 뺐어요 · 따라 말하면 늘 일치도(%)·틀린 단어를 보여줘요
  if (D.mime && D.mime.startsWith('audio')) { S.view = 'audio'; $('#viewMode').parentElement.style.display = 'none'; }
  done = new Set(LS.get(KEY + 'done', []));
  review = LS.get(KEY + 'review', {}) || {};
  Object.keys(review).forEach(i => { if (review[i] && review[i].score != null) scores[i] = review[i].score; });
  bm = LS.get(KEY + 'last', null);
  await syncProgress();
  if (D.youtubeId) {
    const box = document.querySelector('.vbox');

    const frame = document.createElement('div'); frame.className = 'yt-frame';
    box.insertBefore(frame, box.firstChild);
    $('#viewMode').querySelector('[data-v=audio]').textContent = '📝 자막 집중(작은 화면)';
    box.querySelector('.audio-note').textContent = '📝 자막 집중 모드 — 화면은 작게, 문장에 집중해 보세요';
    // YouTube가 지원하는 속도만
    $('#rate').innerHTML = '<option>0.5</option><option>0.75</option><option>1</option><option>1.25</option>';
    S.rate = [0.5, 0.75, 1, 1.25].reduce((a, b) => (Math.abs(b - S.rate) < Math.abs(a - S.rate) ? b : a), 1);
    try { v = await YTMedia.create(frame, D.youtubeId, { start: D.clipStart || 0 }); }
    catch (e) { frame.innerHTML = `<div class="empty" style="color:#fff;">⚠️ ${esc(e.message)}</div>`; return; }

  updateBm();
  if (bm && D.sentences[bm.i]) { goBookmark(true); toast('🔖 마지막으로 공부한 문장부터 이어서 할 수 있어요'); }
}

/* ---- 공부한 문장 ✓ · 책갈피 🔖 ----
 * 문장을 반복 횟수만큼 다 연습하면 '공부함', 가장 최근에 공부한 문장이 책갈피.
 * 회원은 서버에도 저장돼서 다른 기기에서도 같은 표시가 보여요. */
let bm = null;                 // { i: 문장번호, at }
let pendDone = new Set(), pendTimer = null;
const canSync = () => !ADMIN && !!LS.raw('shadowing_member_token');
async function progressApi(body) {
  const headers = { Authorization: 'Bearer ' + LS.raw('shadowing_member_token') };
  const r = body ? await fetch('/api/member-video-progress', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, headers), body: JSON.stringify(Object.assign({ id: D.id }, body)) })
                 : await fetch('/api/member-video-progress?id=' + encodeURIComponent(D.id), { headers });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function syncProgress() {
  if (!canSync()) return;
  try {
    const srv = await Promise.race([progressApi(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))]);
    // 다른 기기에서 '표시 지우기'를 했다면 이 기기에 남은 예전 표시도 버려요
    if (srv.resetAt && srv.resetAt !== LS.get(KEY + 'rs', null)) { done = new Set(); bm = null; }
    LS.set(KEY + 'rs', srv.resetAt || null);
    const mine = [...done].filter(i => !srv.done.includes(i));
    srv.done.forEach(i => done.add(i));
    const newer = bm && (!srv.last || bm.at > srv.last.at);
    if (!newer && srv.last) bm = srv.last;
    LS.set(KEY + 'done', [...done]); LS.set(KEY + 'last', bm);
    if (mine.length || newer) progressApi({ done: mine, last: bm }).catch(() => {}); // 이 기기에만 있던 표시 올리기
  } catch (e) {}
}
function pushProgress(i) {
  if (!canSync()) return;
  pendDone.add(i);
  clearTimeout(pendTimer);
  pendTimer = setTimeout(flushProgress, 2000);
}
function flushProgress(keepalive) {
  clearTimeout(pendTimer);
  if (!pendDone.size || !canSync()) return;
  const doneList = [...pendDone]; pendDone = new Set();
  fetch('/api/member-video-progress', {
    method: 'POST', keepalive: !!keepalive,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + LS.raw('shadowing_member_token') },
    body: JSON.stringify({ id: D.id, done: doneList, last: bm }),
  }).then(r => { if (!r.ok && r.status >= 500) doneList.forEach(i => pendDone.add(i)); }).catch(() => doneList.forEach(i => pendDone.add(i)));
}
window.addEventListener('pagehide', () => { if (D && !D.watchOnly) flushProgress(true); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && D && !D.watchOnly) flushProgress(true); });

// 책갈피 문장이 들어 있는 파트 (지금 파트에 있으면 그대로)
function bmPart() {
  if (!bm) return -1;
  if (list.some(s => s.i === bm.i)) return Number($('#part').value) || 0;
  const k = parts.findIndex(p => !p.full && p.items.some(s => s.i === bm.i));
  return k >= 0 ? k : parts.findIndex(p => p.items.some(s => s.i === bm.i));
}
function updateBm() {
  const s = bm && D && D.sentences[bm.i];
  $('#bmBar').classList.toggle('hidden', !s);
  document.querySelectorAll('.s.bm').forEach(e => e.classList.remove('bm'));
  if (!s) return;
  const p = parts.find(p => !p.full && p.items.includes(s)) || parts[0];
  const short = s.en.length > 70 ? s.en.slice(0, 68) + '…' : s.en;
  const sc = scores[s.i] != null ? ` <span class="sc ${scoreClass(scores[s.i])}">${scores[s.i]}%</span>` : '';
  $('#bmText').innerHTML = `마지막으로 공부한 문장 · ${p && !p.full && parts.length > 1 ? 'Part ' + p.n + ' · ' : ''}${fmt(s.s)}<br><i>“${esc(short)}”</i>${sc}${reviewHtml(s)}`;
  const el = rowEl(list.indexOf(s)); if (el) el.classList.add('bm');
}
function goBookmark(quiet) {
  if (!bm) return;
  const p = bmPart(); if (p < 0) return;
  if (p !== (Number($('#part').value) || 0) || !list.some(s => s.i === bm.i)) { $('#part').value = p; loadPart(p); }
  else if (running) stop();
  const k = list.findIndex(s => s.i === bm.i);
  if (k < 0) return;
  setCurrent(k, true);
  const el = rowEl(k);
  if (el && !quiet) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
async function resetProgress() {
  if (!confirm('이 영상의 「공부함」 표시, 🔖 책갈피, 문장별 발음 결과를 모두 지울까요?')) return;
  done = new Set(); bm = null; pendDone = new Set(); review = {}; Object.keys(scores).forEach(k => delete scores[k]);
  LS.set(KEY + 'done', []); LS.set(KEY + 'last', null); LS.set(KEY + 'review', {});
  if (canSync()) { try { const r = await progressApi({ reset: true }); LS.set(KEY + 'rs', r.resetAt || null); } catch (e) {} }
  buildPartsLabels(); renderList(); setCurrent(cur, false); updateBm();
  toast('표시를 모두 지웠어요');
}
const saveS = () => { const { part, ...rest } = S; LS.set('vs:settings', rest); LS.set(KEY + 'pos', { part }); };

function buildParts() {
  const sents = D.sentences.map((s, i) => Object.assign({ i }, s));
  D.sentences = sents;
  const clipS = D.clipStart || 0;
  const dur = D.clipEnd || D.duration || (sents.length ? sents[sents.length - 1].e : 0);
  // 파트 나누기: 관리자가 고른 '몇 문장 단위'(partSentences)로 영상 속 대사 문장을 N개씩 묶어요.
  // 예전 영상(partSentences 없음)은 'N분 단위'(partMinutes) 그대로.
  const N = D.partSentences != null ? (D.partSentences || 0) : 0;
  const L = D.partSentences != null ? 0 : (D.partMinutes || 0) * 60;
  const cuts = [clipS];
  if (N > 0) {
    for (let k = N; k < sents.length; k += N) cuts.push(sents[k].s);
  } else if (L > 0) {
    let pos = clipS;
    const gaps = sents.slice(1).map((s, k) => Math.min((sents[k].e + s.s) / 2, s.s));
    for (;;) {
      const target = pos + L; if (target >= dur - L * 0.25) break;
      const win = Math.min(20, L * 0.3);
      const c = gaps.filter(g => Math.abs(g - target) <= win && g > pos + L * 0.5);
      const best = c.length ? c.reduce((a, b) => (Math.abs(a - target) <= Math.abs(b - target) ? a : b)) : target;
      cuts.push(best); pos = best;
    }
  }
  cuts.push(dur);
  parts = [];
  for (let k = 0; k + 1 < cuts.length; k++) {
    const items = sents.filter(s => s.s >= cuts[k] && s.s < cuts[k + 1]);
    if (items.length) parts.push({ n: k + 1, start: cuts[k], end: cuts[k + 1], items });
  }
  if (parts.length > 1) parts.unshift({ n: 0, start: clipS, end: dur, items: sents, full: true });
  if (!parts.length) parts = [{ n: 1, start: clipS, end: dur, items: sents }];
  $('#part').innerHTML = parts.map((p, i) => {
    const doneN = p.items.filter(s => done.has(s.i)).length;
    return `<option value="${i}">${p.full ? '전체' : 'Part ' + p.n} · ${fmt(p.start)}–${fmt(p.end)} (${p.items.length}문장${doneN ? ', ✓' + doneN : ''})</option>`;
  }).join('');
  $('#part').style.display = parts.length > 1 ? '' : 'none';
}

function loadPart(i) {
  stop(); S.part = i; saveS();
  list = parts[i].items; cur = 0; rep = 0;
  const firstTodo = list.findIndex(s => !done.has(s.i));
  renderList(); setCurrent(firstTodo > 0 ? firstTodo : 0, true);
}

function wordsHtml(text) {
  return esc(text).split(/(\s+)/).map(t => /[A-Za-z]/.test(t) ? `<span class="w" data-w="${t.replace(/[^A-Za-z'-]/g, '')}">${t}</span>` : t).join('');
}
function scoreClass(n) { return n >= 85 ? 'b-good' : n >= 60 ? 'b-mid' : 'b-bad'; }
function renderList() {
  if (!list.length) { $('#list').innerHTML = '<div class="empty">문장이 없어요.</div>'; return; }
  $('#list').innerHTML = list.map((s, k) => `
    <div class="s${done.has(s.i) ? ' done' : ''}${bm && bm.i === s.i ? ' bm' : ''}" data-k="${k}">
      <div class="t">${fmt(s.s)}</div>
      <div><div class="e">${wordsHtml(s.en)}${scores[s.i] != null ? `<span class="sc ${scoreClass(scores[s.i])}">${scores[s.i]}%</span>` : ''}</div>${s.ko ? `<div class="k">${esc(s.ko)}</div>` : ''}${reviewHtml(s)}</div>
      <div class="acts">
        <button data-a="play" title="이 문장 듣기">▶</button>
        <button data-a="rec" title="이 문장 따라 말하고 채점 (일치도 · 잘못 발음한 단어)">🎙</button>
      </div>
    </div>`).join('');
  updateProg();
}
const rowEl = k => $('#list').querySelector(`.s[data-k="${k}"]`);
// 문장 아래: 마지막으로 따라 말했을 때 잘못 발음한(빠뜨린) 단어와 내가 말한 문장
function reviewHtml(s) {
  const r = review[s.i]; if (!r) return '';
  if (!r.miss.length && !r.extra.length) return `<div class="rv ok">✅ 모두 맞게 말했어요 · 👂 "${esc(r.heard)}"</div>`;
  return `<div class="rv">${r.miss.length ? `🔴 다시 연습할 단어: ${r.miss.map(w => `<span class="rw">${esc(w)}</span>`).join('')}` : ''}${r.extra.length ? ` 🟠 더 말한 단어: ${r.extra.map(w => `<span class="rx">${esc(w)}</span>`).join('')}` : ''}<div class="rh">👂 내가 말한 문장: "${esc(r.heard)}"</div></div>`;
}
function updateProg() {
  const n = list.filter(s => done.has(s.i)).length;
  $('#prog').textContent = `완료 ${n} / ${list.length}`;
}
function setCurrent(k, scroll = true) {
  if (!list.length) return;
  cur = Math.max(0, Math.min(list.length - 1, k));
  document.querySelectorAll('.s.cur').forEach(e => e.classList.remove('cur'));
  const el = rowEl(cur);
  if (el) { el.classList.add('cur'); if (scroll) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  const s = list[cur];
  $('#nowEn').innerHTML = wordsHtml(s.en);
  $('#nowKo').textContent = s.ko || '';
  $('#nowIdx').textContent = `문장 ${cur + 1} / ${list.length}`;
  $('#nowTime').textContent = `${fmt(s.s)} – ${fmt(s.e)} · ${(s.e - s.s).toFixed(1)}초`;
  $('#nowScore').classList.add('hidden');
}
function markDone(s) {
  if (!s) return;
  if (done.has(s.i) && bm && bm.i === s.i) return;
  done.add(s.i); LS.set(KEY + 'done', [...done]);
  bm = { i: s.i, at: new Date().toISOString() }; LS.set(KEY + 'last', bm);
  const el = rowEl(list.indexOf(s)); if (el) el.classList.add('done');
  updateProg(); updateBm(); pushProgress(s.i);
}

/* ---- 재생 엔진 ---- */
function setPill(t, cls = '') { const p = $('#pill'); p.textContent = t; p.className = 'pill ' + cls; }
function setBar(f) { $('#barI').style.width = Math.max(0, Math.min(1, f)) * 100 + '%'; }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; if (countdown) { cancelAnimationFrame(countdown); countdown = null; } }

// 문장 하나를 끝까지 들으면 '공부함' + 책갈피
const heard = k => () => { setPill('대기'); markDone(list[k]); };
function playSentence(k, cb) {
  const s = list[k]; if (!s) return;
  setCurrent(k);
  v.playbackRate = S.rate;
  v.currentTime = s.s;
  stopAt = s.e; onReach = cb || null;
  segFrom = s.s; segArmed = false; segAt = performance.now(); segRetry = 0;
  const p = v.play(); if (p) p.catch(() => toast(v.isYouTube ? '영상 화면을 한 번 눌러 재생한 뒤, 다시 ▶ 연습 시작을 눌러주세요' : '▶ 버튼을 한 번 더 눌러주세요 (브라우저 자동재생 제한)'));
}
// 문장 끝에서 멈춘 직후 잠깐은 영상이 조금 더 흘러가도 화면이 다음 문장으로 넘어가지 않게 잡아 둡니다.
let holdUntil = 0;
function reached() { const cb = onReach; stopAt = null; onReach = null; holdUntil = performance.now() + 800; v.pause(); if (cb) cb(); }
// YouTube는 이동(seek) 직후 잠깐 '예전 시간'을 알려줘요. 두 번째 반복부터는 예전 시간이 이미 문장 끝을 지나 있어서
// 소리가 나기도 전에 '문장 끝'으로 착각 → 띵동·삐만 계속 반복되던 문제를 막으려고, 진짜 시간을 직접 확인합니다.
function realTime() {
  try { if (v.isYouTube && v.player && v.player.getCurrentTime) return v.player.getCurrentTime() || 0; } catch (e) {}
  return v.currentTime;
}
function segCheck() {
  const t = realTime(), now = performance.now();
  if (!segArmed) {
    if (t >= segFrom - 0.6 && t < stopAt - 0.05) { segArmed = true; return false; } // 문장 안으로 제대로 옮겨짐
    const waited = now - segAt;
    if (waited > 700 && segRetry < 3) { segRetry++; segAt = now; try { v.currentTime = segFrom; if (v.paused) v.play().catch(() => {}); } catch (e) {} return false; } // 다시 옮기기
    return segRetry >= 3 && waited > 2500; // 끝내 안 옮겨지면 멈추지 않게 그냥 넘어감
  }
  return t >= stopAt;
}
function loop() {

    else if (e.key === 'ArrowRight') { e.preventDefault(); jump(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); jump(cur - 1); }
    else if (e.key === 'r' || e.key === 'R') $('#again').click();
    else if (e.key === 'm' || e.key === 'M') toggleRec(cur);
    else if (e.key === 'h' || e.key === 'H') document.body.classList.add('reveal');
  });
  document.addEventListener('keyup', e => { if (e.key === 'h' || e.key === 'H') document.body.classList.remove('reveal'); });
  requestAnimationFrame(loop);
}

const id = params.get('id');
if (id) showPlayer(id); else showLibrary();

// ⏱ 하루 쉐도잉 공부 시간: 연습 중이거나 영상이 재생 중일 때(👶 유아 영상 보기 포함) '영상 쉐도잉' 시간으로 재요
if (window.StudyTime && MEMBER_TOKEN && !ADMIN) StudyTime.start({
  getToken: () => LS.raw('shadowing_member_token'),
  getKind: () => (running || (v && v.paused === false) || (KP.media && KP.media.paused === false)) ? 'video' : null,
  onChange: t => {
    const f = StudyTime.format, bar = $('#todayBar');
    bar.innerHTML = `⏱ 오늘 쉐도잉한 시간 ${f((t.feedback || 0) + (t.book || 0) + (t.video || 0))}<span class="parts">피드백 ${f(t.feedback)} · 교재 ${f(t.book)} · <b>🎬 영상 ${f(t.video)}</b></span>`;
    bar.classList.remove('hidden'); document.body.classList.add('has-today-bar');
  },
});
})();
</script>
