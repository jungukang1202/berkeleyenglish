[build]
  publish = "."
  functions = "netlify/functions"

# 작업 규칙(CLAUDE.md)과 검사 스크립트(scripts/)는 사이트에 보이지 않게
[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

# 코드·화면 파일은 브라우저가 저장해 둔 옛 버전을 쓰지 않고, 열 때마다 최신인지 확인하게 합니다.
# (배포 후 다른 기기에서 예전 동작이 남아 있던 문제 방지)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

# .html 없이 들어오는 주소(/member 등)와 버전 확인 파일도 항상 최신으로
[[headers]]
  for = "/member"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/video"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/shadowing"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# 🛡️ 보안 헤더 (모든 화면)
#   다른 사이트가 이 화면을 몰래 틀 안에 넣지 못하게 · 파일 종류 속이기 막기 · 항상 https · 마이크는 이 사이트만
#   noai·noimageai: AI 학습에 쓰지 말라는 표시
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Robots-Tag = "noai, noimageai"

# 관리자·회원·영상·쉐도잉·신청 화면과 서버 주소: 검색·저장·AI 학습 모두 금지
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"

[[headers]]
  for = "/member*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"

[[headers]]
  for = "/video*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"

[[headers]]
  for = "/shadowing*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"

[[headers]]
  for = "/apply*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"
